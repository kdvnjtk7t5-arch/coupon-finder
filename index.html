<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snagged — Don't pay full price</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #14110F;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(198,255,61,0.06), transparent 40%),
      radial-gradient(circle at 90% 30%, rgba(255,90,54,0.05), transparent 35%);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    color: #F5EFE1;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 28px 18px 50px; position: relative; }

  /* Hero */
  .hero { position: relative; margin-bottom: 30px; padding-top: 6px; }
  .eyebrow {
    font-size: 11px; color: #8C8577; letter-spacing: 0.14em; text-transform: uppercase;
    margin-bottom: 10px; font-weight: 600;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 58px;
    line-height: 0.92;
    letter-spacing: 0.01em;
    margin: 0;
    color: #F5EFE1;
    max-width: 78%;
  }
  h1 span { color: #C6FF3D; }

  /* Stamp badge */
  .stamp {
    position: absolute;
    top: -4px;
    right: 0;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 3px dashed rgba(198,255,61,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(11deg);
    flex-shrink: 0;
  }
  .stamp-inner {
    font-family: 'Bebas Neue', sans-serif;
    color: #C6FF3D;
    text-align: center;
    line-height: 0.95;
    font-size: 15px;
    letter-spacing: 0.03em;
  }
  .stamp-inner b { display: block; font-size: 26px; }

  /* Search */
  .search {
    display: flex; align-items: center; gap: 10px;
    background: rgba(245,239,225,0.06);
    border: 1.5px solid rgba(245,239,225,0.16);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 28px;
  }
  .search svg { flex-shrink: 0; opacity: 0.6; }
  .search input {
    background: transparent; border: none; outline: none; color: #F5EFE1;
    font-size: 16px; width: 100%; font-family: 'Inter', sans-serif; font-weight: 500;
  }
  .search input::placeholder { color: #7A7466; }

  /* Store groups */
  .store-block { margin-bottom: 26px; }
  .store-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.03em;
    color: #F5EFE1;
    margin-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .store-name .count {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #14110F;
    background: #C6FF3D;
    border-radius: 20px;
    padding: 2px 8px;
    letter-spacing: 0.02em;
  }

  /* Ticket */
  .ticket {
    display: flex;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));
  }
  .ticket.expired { opacity: 0.42; }
  .ticket-body {
    flex: 1;
    background: #F5EFE1;
    border-radius: 12px 0 0 12px;
    padding: 16px 18px;
    position: relative;
  }
  .status-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .status-label {
    font-size: 10.5px; color: #8C8577; letter-spacing: 0.06em;
    text-transform: uppercase; font-weight: 700;
  }
  .desc { font-size: 15.5px; color: #14110F; font-weight: 600; line-height: 1.25; }

  .perf {
    width: 0;
    border-left: 2.5px dashed rgba(20,17,15,0.18);
    background: #F5EFE1;
    position: relative;
  }
  .perf::before, .perf::after {
    content: ''; position: absolute; left: -8px; width: 16px; height: 16px;
    background: #14110F; border-radius: 50%;
  }
  .perf::before { top: -8px; }
  .perf::after { bottom: -8px; }

  .stub {
    width: 128px;
    background: #F5EFE1;
    border-radius: 0 12px 12px 0;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 10px;
  }
  .ticket.expired .stub { cursor: default; }
  .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: #14110F;
    letter-spacing: 0.02em;
  }
  .copy-label { font-size: 11px; color: #8C8577; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .copy-label.copied { color: #4C9A2A; }

  .empty { color: #8C8577; font-size: 14px; padding: 30px 0; text-align: center; }
  .footer {
    margin-top: 20px; color: #5E594D; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }

  @media (max-width: 380px) {
    h1 { font-size: 46px; }
    .stamp { width: 78px; height: 78px; }
    .stamp-inner b { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">Before you check out</div>
    <h1>Don't pay <span>full</span> price.</h1>
    <div class="stamp" aria-hidden="true">
      <div class="stamp-inner"><b id="codeCount">0</b>codes<br/>live</div>
    </div>
  </div>

  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F5EFE1" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" placeholder="Search a store..." />
  </div>

  <div id="results"></div>

  <div class="footer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5E594D" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Codes checked periodically — sample data for now.
  </div>
</div>

<script>
const STORES = [
  { name: "Nike", codes: [
    { code: "RUNFAST20", desc: "20% off running shoes", status: "active" },
    { code: "FREESHIP", desc: "Free shipping, no minimum", status: "active" },
  ]},
  { name: "Target", codes: [
    { code: "SAVE15NOW", desc: "15% off home goods", status: "active" },
    { code: "WELCOME10", desc: "10% off first order", status: "expiring" },
  ]},
  { name: "Sephora", codes: [
    { code: "GLOW25", desc: "25% off skincare sets", status: "active" },
  ]},
  { name: "Nomad Coffee Co", codes: [
    { code: "BEANS5", desc: "$5 off bags over $25", status: "active" },
    { code: "SUMMER22", desc: "Free mug with order", status: "expired" },
  ]},
  { name: "Everlane", codes: [
    { code: "COTTON15", desc: "15% off basics", status: "active" },
  ]},
];

const STATUS_STYLES = {
  active: { label: "Active", dot: "#4C9A2A" },
  expiring: { label: "Expiring soon", dot: "#E8A93B" },
  expired: { label: "Expired", dot: "#FF5A36" },
};

function totalActive() {
  return STORES.reduce((sum, s) => sum + s.codes.filter(c => c.status !== 'expired').length, 0);
}

function render(query) {
  const resultsEl = document.getElementById('results');
  const q = (query || '').toLowerCase().trim();
  const filtered = q ? STORES.filter(s => s.name.toLowerCase().includes(q)) : STORES;

  if (filtered.length === 0) {
    resultsEl.innerHTML = `<div class="empty">No store matches &ldquo;${escapeHtml(query)}&rdquo; yet.<br/>More stores are added regularly.</div>`;
    return;
  }

  resultsEl.innerHTML = filtered.map(store => `
    <div class="store-block">
      <div class="store-name">${escapeHtml(store.name)} <span class="count">${store.codes.filter(c=>c.status!=='expired').length} live</span></div>
      ${store.codes.map(c => ticketHtml(c)).join('')}
    </div>
  `).join('');

  resultsEl.querySelectorAll('.stub[data-code]').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.getAttribute('data-code');
      const isExpired = btn.getAttribute('data-expired') === 'true';
      if (isExpired) return;
      navigator.clipboard?.writeText(code).catch(() => {});
      const label = btn.querySelector('.copy-label');
      label.textContent = '✓ Copied';
      label.classList.add('copied');
      setTimeout(() => {
        label.textContent = 'Tap to copy';
        label.classList.remove('copied');
      }, 1500);
    });
  });
}

function ticketHtml(c) {
  const status = STATUS_STYLES[c.status];
  const isExpired = c.status === 'expired';
  return `
    <div class="ticket ${isExpired ? 'expired' : ''}">
      <div class="ticket-body">
        <div class="status-row">
          <span class="dot" style="background:${status.dot}"></span>
          <span class="status-label">${status.label}</span>
        </div>
        <div class="desc">${escapeHtml(c.desc)}</div>
      </div>
      <div class="perf"></div>
      <button class="stub" data-code="${escapeHtml(c.code)}" data-expired="${isExpired}">
        <span class="code">${escapeHtml(c.code)}</span>
        <span class="copy-label">${isExpired ? 'Unavailable' : 'Tap to copy'}</span>
      </button>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

document.getElementById('codeCount').textContent = totalActive();
document.getElementById('searchInput').addEventListener('input', (e) => render(e.target.value));
render('');
</script>
</body>
</html>
